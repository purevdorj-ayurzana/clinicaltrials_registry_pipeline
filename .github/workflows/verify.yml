name: Offline reproduction
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/verify_data.py
      - run: python -m unittest discover -s tests
      - run: python src/reproduce.py --output-dir reproduced
